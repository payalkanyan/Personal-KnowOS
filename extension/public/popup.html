<!DOCTYPE html>
<html>
<head>
    <title>PK OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #f8fafc;
            --surface: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 12px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body { 
            width: 380px; 
            padding: 20px; 
            margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
            background: linear-gradient(135deg, #f0fdfa 0%, #e0e7ff 100%);
            color: var(--text-main);
            box-sizing: border-box;
        }

        h3 { 
            margin: 0 0 16px 0; 
            font-weight: 600; 
            font-size: 1.25rem;
            color: var(--text-main);
            text-align: center;
            letter-spacing: -0.025em;
        }

        .section { 
            background: var(--surface); 
            padding: 16px; 
            border-radius: var(--radius); 
            margin-bottom: 16px; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -2px rgba(0,0,0,0.025); 
            border: 1px solid rgba(255,255,255,0.5);
            transition: var(--transition);
        }

        .section:hover {
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -4px rgba(0,0,0,0.04);
        }

        .btn { 
            padding: 10px 16px; 
            background: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 100%; 
            font-weight: 500; 
            font-size: 0.95rem;
            transition: var(--transition);
            box-shadow: 0 2px 4px rgba(99, 102, 241, 0.2);
            position: relative;
            overflow: hidden;
        }

        .btn:hover { 
            background: var(--primary-hover); 
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(99, 102, 241, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled { 
            background: #cbd5e1; 
            cursor: not-allowed; 
            transform: none;
            box-shadow: none;
        }

        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
            box-shadow: none;
        }

        .btn-outline:hover {
            background: #eef2ff;
            color: var(--primary-hover);
        }

        input[type="text"] { 
            width: 100%; 
            padding: 12px 14px; 
            box-sizing: border-box; 
            margin-bottom: 12px; 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            font-family: inherit;
            font-size: 0.95rem;
            transition: var(--transition);
            background: #f8fafc;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        #resultsArea { 
            margin-top: 0; 
            font-size: 0.9rem; 
            color: var(--text-main); 
            max-height: 0; 
            overflow-y: auto; 
            transition: max-height 0.6s cubic-bezier(0.4, 0, 0.2, 1), margin-top 0.3s ease, opacity 0.4s ease;
            opacity: 0;
            line-height: 1.5;
        }

        #resultsArea.active {
            margin-top: 16px;
            max-height: 400px;
            opacity: 1;
        }

        .source-link { 
            display: block; 
            font-size: 0.85rem; 
            color: var(--primary); 
            text-decoration: none; 
            margin-top: 6px; 
            padding: 8px 12px;
            background: #f1f5f9;
            border-radius: 6px;
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            transition: var(--transition);
            border: 1px solid transparent;
        }

        .source-link:hover { 
            background: #eef2ff;
            border-color: #c7d2fe;
            text-decoration: none; 
        }

        .thinking {
            display: inline-block;
        }

        .thinking:after {
            content: '.';
            animation: dots 1.5s steps(5, end) infinite;
        }

        @keyframes dots {
            0%, 20% { color: rgba(255,255,255,0); text-shadow: .25em 0 0 rgba(255,255,255,0), .5em 0 0 rgba(255,255,255,0); }
            40% { color: white; text-shadow: .25em 0 0 rgba(255,255,255,0), .5em 0 0 rgba(255,255,255,0); }
            60% { text-shadow: .25em 0 0 white, .5em 0 0 rgba(255,255,255,0); }
            80%, 100% { text-shadow: .25em 0 0 white, .5em 0 0 white; }
        }
        
        .answer-box {
            background: #f8fafc;
            padding: 14px;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
            margin-bottom: 12px;
        }
        
        .answer-box p:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <h3>Personal Knowledge OS</h3>
    
    <div class="section">
        <input type="text" id="queryInput" placeholder="Ask your agent anything..." autocomplete="off" />
        <button class="btn" id="searchBtn">Ask Agent</button>
        <div id="resultsArea"></div>
    </div>

    <div class="section" style="padding: 12px;">
        <button class="btn btn-outline" id="saveBtn">Save Page to Brain</button>
    </div>

    <script src="popup.js"></script>
</body>
</html>
